<title>CRM Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Concept: the same dark Admin look as the live back office, so the CRM reads as one more admin area. All numbers are example data. */
:root { color-scheme: dark; --page:#17181B; --card:#202226; --card2:#272A2F; --hair:#34373D; --ink:#F1F2F4; --text:#C4C8D0; --muted:#9AA0AB; --field:#6F7480; --side:#101114;
  --cyan:#2EC39B; --on-cyan:#0B2B22; --ruby:#E5484D; --ruby-text:#F2767B; --ruby-bg:#40282C; --burnt:#F0883E; --burnt-text:#F59A57; --burnt-bg:#41322A; --ok-bg:#1E4D40; --ok-text:#6FE0BE; --font:'Mulish','Avenir',system-ui,sans-serif; }
* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--text); font-family:var(--font); font-size:15px; line-height:1.5; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-bottom:48px; }
.strip { margin:0 -16px; background:var(--cyan); color:var(--on-cyan); font-weight:800; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; padding:6px 16px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.wrap { max-width:1180px; margin:0 auto; }
h1 { color:var(--ink); font-size:28px; margin:18px 0 4px; font-weight:800; letter-spacing:-.01em; }
h2 { color:var(--ink); font-size:17px; margin:0 0 10px; font-weight:800; } h3 { color:var(--ink); font-size:14px; margin:0; font-weight:800; }
.sub { color:var(--muted); margin:0 0 14px; font-size:14px; }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin:14px 0 18px; }
.tab { font:inherit; font-weight:800; min-height:44px; padding:0 18px; border-radius:22px; border:1px solid var(--hair); background:var(--card); color:var(--ink); cursor:pointer; }
.tab[aria-selected="true"] { background:var(--ink); color:var(--page); border-color:var(--ink); }
.card { background:var(--card); border:1px solid var(--hair); border-radius:8px; padding:18px 20px; margin-bottom:14px; }
.grid2 { display:grid; gap:14px; grid-template-columns:minmax(0,1fr); } @media (min-width:900px){ .grid2 { grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); align-items:start; } }
.chip { display:inline-block; padding:2px 9px; border-radius:4px; font-size:12px; font-weight:800; border:1px solid transparent; background:var(--hair); color:var(--ink); }
.chip.ok { background:rgba(46,195,155,.16); color:var(--ok-text); border-color:rgba(46,195,155,.5); }
.chip.warn { background:var(--burnt-bg); color:var(--burnt-text); border-color:var(--burnt); }
.chip.bad { background:var(--ruby-bg); color:var(--ruby-text); border-color:var(--ruby); }
.chip.hot { background:var(--ruby-bg); color:var(--ruby-text); border-color:var(--ruby); } .chip.warm { background:var(--burnt-bg); color:var(--burnt-text); border-color:var(--burnt); } .chip.cold { background:var(--card2); color:var(--muted); border-color:var(--hair); }
.btn { font:inherit; font-weight:800; min-height:40px; padding:0 14px; border-radius:4px; border:1px solid var(--field); background:transparent; color:var(--ink); cursor:pointer; }
.btn.p { background:var(--cyan); border-color:var(--cyan); color:var(--on-cyan); } .btn.s { min-height:36px; font-size:13px; padding:0 12px; }
.btn.d { border-color:var(--ruby); color:var(--ruby-text); }
select, input { font:inherit; color:var(--ink); background:var(--page); border:1px solid var(--field); border-radius:6px; padding:8px 12px; min-height:42px; }
:focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
/* pipeline */
.board { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(210px,1fr); gap:12px; overflow-x:auto; padding-bottom:8px; }
.col { background:var(--card2); border:1px solid var(--hair); border-radius:8px; padding:10px; min-height:300px; }
.col.over { outline:2px dashed var(--cyan); }
.col header { display:flex; justify-content:space-between; color:var(--ink); font-weight:800; font-size:13px; margin-bottom:8px; } .col header span { color:var(--muted); font-weight:600; }
.deal { background:var(--card); border:1px solid var(--hair); border-radius:6px; padding:10px 12px; margin-bottom:8px; cursor:grab; } .deal:active { cursor:grabbing; }
.deal b { color:var(--ink); display:block; } .deal small { color:var(--muted); display:block; margin:2px 0 6px; } .deal .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.deal .val { color:var(--ink); font-weight:800; margin-left:auto; font-variant-numeric:tabular-nums; }
/* contact */
.tl { list-style:none; margin:0; padding:0; } .tl li { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--hair); } .tl li:last-child { border:0; }
.ico { width:34px; height:34px; border-radius:50%; background:var(--card2); border:1px solid var(--hair); display:grid; place-items:center; flex:none; color:var(--cyan); font-weight:800; font-size:13px; }
.tl .when { color:var(--muted); font-size:12.5px; margin-left:auto; white-space:nowrap; }
.tl p { margin:3px 0 0; font-size:14px; } .tl .sum { background:var(--card2); border-radius:6px; padding:8px 12px; margin-top:6px; font-size:14px; }
dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:8px 14px; font-size:14px; } dt { color:var(--muted); } dd { margin:0; color:var(--ink); text-align:right; }
.bar { height:10px; border-radius:5px; background:var(--hair); overflow:hidden; } .bar i { display:block; height:100%; background:var(--cyan); }
.score { font-size:34px; font-weight:800; color:var(--ink); line-height:1; }
/* dashboard */
.stat { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); margin-bottom:14px; } .stat .card { margin:0; } .stat .n { font-size:30px; font-weight:800; color:var(--ink); line-height:1.1; } .stat small { color:var(--muted); }
table { width:100%; border-collapse:collapse; font-size:14px; } th { text-align:left; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; padding:8px 10px; border-bottom:1px solid var(--hair); } td { padding:10px; border-bottom:1px solid var(--hair); } td b { color:var(--ink); } .tw { overflow-x:auto; } td.r, th.r { text-align:right; font-variant-numeric:tabular-nums; }
.hbar { display:grid; grid-template-columns:150px 1fr 52px; gap:10px; align-items:center; margin:8px 0; font-size:14px; } .hbar .bar { height:14px; }
.funnel > div { display:flex; align-items:center; gap:10px; margin:6px 0; } .funnel .f { height:30px; border-radius:4px; background:var(--cyan); color:var(--on-cyan); font-weight:800; display:flex; align-items:center; padding:0 10px; font-size:13px; min-width:60px; }
.heat { display:grid; grid-template-columns:150px repeat(8,minmax(54px,1fr)); gap:3px; font-size:12.5px; min-width:640px; } .heat .h { color:var(--muted); font-weight:800; text-align:center; padding:4px 2px; } .heat .n { color:var(--ink); padding:8px 0; } .heat .c { border-radius:4px; height:36px; display:grid; place-items:center; font-weight:800; color:var(--ink); }
.note { background:rgba(46,195,155,.12); border-radius:6px; padding:10px 14px; font-size:14px; color:var(--ink); margin:0 0 14px; }
.legend { display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--muted); margin-top:10px; } .legend i { width:16px; height:16px; border-radius:3px; display:inline-block; vertical-align:middle; margin-right:5px; }
</style>

<div class="strip"><span>Admin · CRM preview</span><span>Example data. Nothing here is live.</span></div>
<div class="wrap">
  <h1>CRM</h1>
  <p class="sub">A proposed look for the pipelines, records, sources dashboard, checkout recovery and marketing. Click the tabs; drag deals between stages.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</div>

<script>
(function () {

  var deals = [
    { id: 1, st: 0, co: 'Severn Pipeline Services', who: 'Priya Shah', v: 1850, src: 'Google Ads', tag: 'CompEx', hot: true, due: 'Reply due today' },
    { id: 2, st: 0, co: 'Calder Water Utilities', who: 'Mark Ellis', v: 0, src: 'Contact form', tag: 'Thames Water' },
    { id: 3, st: 0, co: 'Nordic Chemicals UK', who: 'Sara Lindqvist', v: 4200, src: 'LinkedIn', tag: 'DSEAR' },
    { id: 4, st: 1, co: 'Thames Contractors Ltd', who: 'Dan Ahmed', v: 6200, src: 'Email campaign', tag: 'CompEx', due: 'Follow up Thu' },
    { id: 5, st: 1, co: 'Harbour Gas Terminal', who: 'Jo Marsh', v: 9500, src: 'Referral', tag: 'Consultancy' },
    { id: 6, st: 2, co: 'Eastgate Pharma', who: 'Louise Park', v: 12400, src: 'Organic search', tag: 'DSEAR', due: 'No reply 5 days' },
    { id: 7, st: 2, co: 'Bluewater Treatment', who: 'Ian Cole', v: 3100, src: 'Google Ads', tag: 'eLearning' },

      '<li><span class="ico">✉</span><div style="flex:1"><b style="color:var(--ink)">Email, marked private by Tom</b><p style="color:var(--muted)">Hidden from other Admins. As Super Admin you can open it with a reason; opening is logged. <span class="btn s d">Open with a reason</span></p></div><span class="when">Mon 11:05</span></li>' +

    return '<div class="note">Illustrative figures for the last 90 days. Sources come from the tags on each visitor’s first and last visit, saved with every enquiry, booking and credit application.</div>' +

    var h = '<div class="note">Example campaign and figures. Opens are the least reliable signal (some email apps open messages automatically), so clicks and site visits carry the score.</div>' +
      '<div class="stat"><div class="card"><small>Campaign</small><div class="n" style="font-size:18px;line-height:1.3">CompEx renewal reminder</div><small>Sent Tue 9 Nov, 412 people</small></div><div class="card"><small>Delivered</small><div class="n">405</div><small>98% · 7 bounced</small></div><div class="card"><small>Clicked</small><div class="n">64</div><small>16% · opened 188</small></div><div class="card"><small>Booked after</small><div class="n">11</div><small>£9,870 of bookings</small></div><div class="card"><small>Unsubscribed</small><div class="n">2</div><small>blocked automatically</small></div></div>' +
      '<div class="grid2"><div class="card"><h2>Who clicked what</h2><div class="tw"><table><thead><tr><th>Link</th><th>Tag</th><th class="r">Clicks</th></tr></thead><tbody><tr><td><b>ExA dates</b></td><td><span class="chip">CompEx</span></td><td class="r">31</td></tr><tr><td><b>Ex12 dates</b></td><td><span class="chip">CompEx</span></td><td class="r">17</td></tr><tr><td><b>Group booking enquiry</b></td><td><span class="chip">CompEx</span></td><td class="r">9</td></tr><tr><td><b>Thames Water passport</b></td><td><span class="chip">Thames Water</span></td><td class="r">7</td></tr></tbody></table></div></div>' +
      '<div class="card"><h2>Engagement scores</h2><p class="sub">A click adds 5, an email visit 3, an enquiry 10, a booking 20. Points fade over about 90 days.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip hot">Hot 70 and over: 38 people</span><span class="chip warm">Warm 40 to 69: 112</span><span class="chip cold">Cold under 40: 262</span></div></div></div>' +
      '<div class="card"><h2>Interest heat map</h2><p class="sub">Each click, page view and booking adds interest to a tag. Click a cell pattern to turn it into a list, for example "hot on CompEx, no booking in 12 months".</p><div class="tw"><div class="heat"><div></div>' + tags.map(function (t) { return '<div class="h">' + t + '</div>'; }).join('') +
      people.map(function (p) { return '<div class="n">' + p[0] + ' <span class="chip ' + p[3] + '">' + p[2] + '</span></div>' + p[1].map(function (v) { return '<div class="c" style="background:' + heatColour(v) + '">' + (v || '') + '</div>'; }).join(''); }).join('') + '</div></div>' +
      '<div class="legend"><span><i style="background:var(--card2)"></i>No interest</span><span><i style="background:rgba(46,195,155,.3)"></i>Some</span><span><i style="background:rgba(46,195,155,.9)"></i>Strong</span><span style="margin-left:auto"><span class="btn s p">Make a list from this</span></span></div></div>';
    return h;
  }
  var views = { pipe: pipe, contact: contact, src: src, chk: chk, mkt: mkt };
  function render() {
    el('tabs').innerHTML = tabs.map(function (t) { return '<button class="tab" role="tab" type="button" data-t="' + t[0] + '" aria-selected="' + (t[0] === cur) + '">' + t[1] + '</button>'; }).join('');
    el('view').innerHTML = views[cur]();
    bindDrag();
  }
  function bindDrag() {
    var board = el('board'); if (!board) return; var dragging = null;
    board.addEventListener('dragstart', function (e) { var d = e.target.closest('.deal'); if (!d) return; dragging = Number(d.dataset.id); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragging)); } catch (x) {} });
    board.addEventListener('dragover', function (e) { var c = e.target.closest('.col'); if (!c) return; e.preventDefault(); board.querySelectorAll('.col').forEach(function (x) { x.classList.toggle('over', x === c); }); });
    board.addEventListener('dragleave', function (e) { if (!e.relatedTarget || !board.contains(e.relatedTarget)) board.querySelectorAll('.col').forEach(function (x) { x.classList.remove('over'); }); });
    board.addEventListener('drop', function (e) { var c = e.target.closest('.col'); if (!c || dragging == null) return; e.preventDefault(); var d = deals.filter(function (x) { return x.id === dragging; })[0]; d.st = Number(c.dataset.st); dragging = null; render(); });
  }
  document.addEventListener('click', function (e) { var t = e.target.closest('[data-t]'); if (t) { cur = t.dataset.t; render(); } });
  render();
})();
</script>
